name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --target Spectro_VST3 --parallel
          cmake --build build --config Release --target Spectro_AU --parallel
          cmake --build build --config Release --target Spectro_Standalone --parallel

      - name: Collect, ad-hoc sign, strip quarantine
        run: |
          set -euxo pipefail
          mkdir -p dist/stage
          for name in Spectro.vst3 Spectro.component Spectro.app; do
            src=$(find build -name "$name" -maxdepth 6 -prune | head -1)
            test -n "$src" || { echo "::error::$name not found in build/"; find build -maxdepth 5 -name '*.vst3' -o -maxdepth 5 -name '*.component' -o -maxdepth 5 -name '*.app'; exit 1; }
            cp -R "$src" dist/stage/
          done
          for b in dist/stage/*; do
            xattr -cr "$b"
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict "$b"
          done

      - name: Zip (used by curl script + Homebrew)
        run: |
          cd dist/stage
          ditto -c -k --norsrc . ../Spectro-macOS.zip
          cd .. && shasum -a 256 Spectro-macOS.zip | tee Spectro-macOS.zip.sha256

      - name: Build .pkg (optional)
        continue-on-error: true
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"; [[ "$V" =~ ^[0-9]+(\.[0-9]+)*$ ]] || V="0.0.0"
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components pkgroot/Applications pkgscripts
          cp -R dist/stage/Spectro.vst3      pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R dist/stage/Spectro.component pkgroot/Library/Audio/Plug-Ins/Components/
          cp -R dist/stage/Spectro.app       pkgroot/Applications/
          cp installer/mac/postinstall pkgscripts/postinstall && chmod +x pkgscripts/postinstall
          pkgbuild --root pkgroot --scripts pkgscripts --identifier com.aronh.spectro --version "$V" dist/Spectro-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Spectro-macOS.zip
            dist/Spectro-macOS.zip.sha256
            dist/Spectro-macOS.pkg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target Spectro_VST3 Spectro_Standalone
      - name: Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows\spectro.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/Spectro-Windows-Setup.exe }

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
